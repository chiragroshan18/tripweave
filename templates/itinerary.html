{% extends "base.html" %}

{% block title %}Itinerary & Timeline — TripWeave{% endblock %}

{% block content %}
<section id="itinerary-section" class="section-pane active">
  <div class="filter-bar">
    <div class="filter-group">
      <label style="font-weight: 600; font-size: 0.9rem;">Select Journey:</label>
      <select id="trip-selector" class="select-custom"></select>
    </div>
    <div style="display: flex; gap: 0.75rem;">
      <button class="btn btn-sm btn-outline" onclick="openAddActivityModal()">+ Add Activity</button>
      <button class="btn btn-sm btn-outline" onclick="openSlidePanel('panel-add-journal')">✍️ Write Journal</button>
      <button class="btn btn-sm btn-secondary" onclick="window.print()">🖨️ Print Itinerary</button>
    </div>
  </div>

  <div class="grid-2col">
    <div>
      <h3 class="section-title" style="margin-bottom: 1rem;">Day-by-Day Journey Timeline</h3>
      <div id="itinerary-content">
        <!-- Populated dynamically -->
      </div>
    </div>

    <div>
      <!-- Budget Summary Panel -->
      <div class="card-panel" style="margin-bottom: 2rem;">
        <h3 class="panel-title font-heading">
          Budget Breakdown
          <span style="font-size: 0.85rem; font-family: var(--font-body); color: var(--color-muted);" id="summary-daily-avg">₹0/day</span>
        </h3>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border);">
          <span style="font-weight: 600;">Total Calculated Cost</span>
          <span style="font-size: 1.4rem; font-family: var(--font-heading); font-weight: 700; color: var(--color-terracotta);" id="summary-total-cost">₹0</span>
        </div>
      </div>

      <!-- Packing Checklist Panel -->
      <div class="card-panel" style="margin-bottom: 2rem;">
        <h3 class="panel-title font-heading">
          Packing Checklist
          <small style="font-size: 0.78rem; color: var(--color-muted);" id="packing-count-label">0 packed</small>
        </h3>
        <div class="packing-progress-bar">
          <div id="packing-progress-fill" class="packing-progress-fill"></div>
        </div>

        <form onsubmit="submitCreatePacking(event)" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
          <input type="text" name="name" class="form-input" placeholder="Add item (e.g. Passport, Charger)" required>
          <select name="category" class="form-select" style="width: 140px;">
            <option value="Essentials">Essentials</option>
            <option value="Clothing">Clothing</option>
            <option value="Electronics">Electronics</option>
            <option value="Toiletries">Toiletries</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary">+</button>
        </form>

        <ul id="packing-list-container" class="checklist-items">
          <!-- Populated dynamically -->
        </ul>
      </div>

      <!-- Travel Journal Panel -->
      <div class="card-panel">
        <h3 class="panel-title font-heading">
          Travel Journal
          <button class="btn btn-sm btn-outline" onclick="openSlidePanel('panel-add-journal')">+ New Entry</button>
        </h3>
        <div id="journal-list-container">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>
</section>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof switchSection === 'function') switchSection('itinerary');
  });
</script>
{% endblock %}
